name: Bug report
description: Something is broken.
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a task called "..."
        2. Click "Done"
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: logs
    attributes:
      label: Console output or failing test
      render: text
