name: Feature request
description: Suggest a change. Well-written requests can be assigned straight to Copilot.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user not do today?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behaviour, one per line. These become tests.
      placeholder: |
        - Given a task, when I double-click its title, then I can edit it inline
        - Pressing Escape cancels the edit
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      description: Tick any that apply. These need maintainer approval before an agent starts.
      options:
        - label: Needs a new dependency
        - label: Changes the storage schema
        - label: Changes the Content Security Policy
